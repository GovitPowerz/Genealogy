<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Genealogy Tree</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Genealogy</p>
        <h1>Family Tree</h1>
        <p class="intro">
          A simple family genealogy tree ready to publish with GitHub Pages.
        </p>
      </header>

      <section aria-labelledby="tree-title" class="tree-section">
        <div class="section-heading">
          <h2 id="tree-title">Tree Overview</h2>
          <p>Sample lineage displayed with plain HTML, CSS, and JavaScript.</p>
        </div>
        <div id="tree-root" class="tree-shell" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
